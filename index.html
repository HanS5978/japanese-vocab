<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的日文單字本</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日文單字">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{
    --bg:#f5f3ef; --card:#fff; --ink:#1f2a2e; --muted:#6b7478; --line:#e4e0d8;
    --accent:#2f5d8a; --accent-soft:#e3ecf5; --warn:#b4462f; --warn-soft:#f8e6e1; --gold:#b9831f; --gold-soft:#f7edd6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171b; --card:#1e2329; --ink:#e9ecea; --muted:#9aa4a8; --line:#2d343b;
      --accent:#7fb0e0; --accent-soft:#1d2a38; --warn:#e8836c; --warn-soft:#3a2420; --gold:#e0b25a; --gold-soft:#3a3020; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Hiragino Sans","Noto Sans TC","Noto Sans JP","Microsoft JhengHei",sans-serif;line-height:1.5;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  .ja{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",-apple-system,sans-serif}
  header{padding:16px 16px 4px;max-width:640px;margin:0 auto;display:flex;align-items:baseline;gap:8px}
  h1{font-size:20px;margin:0}
  .sync{margin-left:auto;font-size:12px;color:var(--muted)}
  main{max-width:640px;margin:0 auto;padding:8px 16px 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px;color:var(--accent)}
  .stat small{color:var(--muted);font-size:12px}
  .bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .bigword{font-size:40px;font-weight:700;text-align:center;letter-spacing:2px;margin-top:6px}
  .kana{font-size:20px;text-align:center;color:var(--accent);letter-spacing:2px}
  .pos{color:var(--muted);font-size:13px;font-weight:400}
  .zh{font-size:16px}
  .ex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:17px}
  .zh2{color:var(--muted);font-size:14px}
  .icon{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:14px;cursor:pointer;white-space:nowrap;font-family:inherit}
  .icon:active,.btn:active{transform:scale(.97)}
  .btn{border:none;background:var(--accent);color:#fff;border-radius:12px;padding:13px 16px;font-size:16px;cursor:pointer;width:100%;font-family:inherit}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.warn{background:var(--warn)}
  .btn:disabled{opacity:.45}
  .btns{display:flex;gap:8px;margin-top:10px}
  input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .q-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}
  .q-zh{font-size:19px;font-weight:600}
  .q-sent{font-size:19px;margin:12px 0 4px;line-height:1.8}
  .blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--gold);text-align:center;color:var(--gold);font-weight:700;letter-spacing:1px}
  .answer{font-size:22px;letter-spacing:2px;text-align:center}
  .preview{text-align:center;color:var(--accent);font-size:18px;min-height:26px;margin-top:4px;letter-spacing:2px}
  .fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
  .fb.ok{background:var(--accent-soft);color:var(--accent)}
  .fb.no{background:var(--warn-soft);color:var(--warn)}
  .diff{font-size:22px;letter-spacing:2px}
  .diff b{color:var(--warn);text-decoration:underline}
  .big{font-size:40px;font-weight:800;text-align:center;color:var(--accent)}
  .center{text-align:center}
  .muted{color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .star{color:var(--gold)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:middle}
  .tag.new{background:var(--line);color:var(--muted)}
  .tag.due{background:var(--gold-soft);color:var(--gold)}
  .list .item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .list .item:last-child{border-bottom:none}
  .list .w{font-weight:700;font-size:17px}
  .list .r{color:var(--accent);font-size:13px;margin-left:6px}
  .list .m{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .detail{padding:4px 0 10px;border-bottom:1px solid var(--line)}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:70px;padding:9px 6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .note{background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
  #toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2a2e;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90%;text-align:center;display:none}
  h2{font-size:16px;margin:0 0 6px}
  .rule{padding:10px 0;border-top:1px solid var(--line)}.rule:first-of-type{border-top:none}.rule b.k{color:var(--accent);font-size:18px}
  .kgrid{display:grid;gap:6px}
  .kcell{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2;font-family:inherit}
  .kcell.empty{border:none;background:none}
  .kcell .kb{font-size:24px;font-weight:700}.kcell .kk{font-size:16px;color:var(--accent)}.kcell small{color:var(--muted);font-size:11px;font-family:-apple-system,sans-serif}
  .kcell:active{transform:scale(.95)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:8}
  .sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
  .kbig{font-size:96px;font-weight:700;text-align:center;line-height:1.3;margin:6px 0}
  .kopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kopts .btn{font-size:20px}
</style>
</head>
<body>
<header><h1 id="title" style="cursor:pointer">🌸 我的日文單字本</h1><span class="sync" id="sync">本機模式</span></header>
<main id="app"><div class="empty">載入單字中…</div></main>
<div id="toast"></div>
<script src="words.js"></script>
<script>
/* ================= 資料 ================= */
const GROUPS = [
  {id:"n5",     icon:"🌱", name:"N5 基礎",     desc:"考 N4 之前一定要會的 N5 單字：招呼、數字、時間、基本動詞與形容詞"},
  {id:"n4",     icon:"📗", name:"N4 核心",     desc:"N4 範圍的動詞、形容詞、副詞、名詞與常用敬語"},
  {id:"travel", icon:"✈️", name:"生活與旅遊", desc:"機場、飯店、電車、點餐、購物、觀光、看病與實用短句"}
];
const DAY = 6;    // 每天 6 個新字
const PRESETS = [
  {name:"固定", r:[2,2,2]}   // 每條路線每天各 2 個
];
const K = x => x.w+"|"+x.r;   // 單字的唯一代號（同一個漢字不同讀音算不同字）
const TOPICS = (window.VOCAB||[]).map(([name,group,ws])=>({name, group, words:ws.map(a=>({w:a[0],r:a[1],pos:a[2],zh:a[3],ex:a[4],exZh:a[5],sp:a[6],topic:name}))}));
const ALL = []; const BY = new Map();
TOPICS.forEach(t=>t.words.forEach(x=>{ const k=K(x); if(!BY.has(k)){ ALL.push(x); BY.set(k, x); } }));
function groupWords(gid){ const seen=new Set(), out=[]; TOPICS.filter(t=>t.group===gid).forEach(t=>t.words.forEach(x=>{const k=K(x); if(!seen.has(k)){seen.add(k); out.push(x);}})); return out; }
const GW = Object.fromEntries(GROUPS.map(g=>[g.id, groupWords(g.id)]));
const INTERVALS = [0,1,2,4,7,15,30,60,120];   // box → 下次複習的天數
const MASTER_BOX = 6;

function today(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); }
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ================= 假名與羅馬拼音 ================= */
const RO = (()=>{ const t={}, V="aiueo";
  const rows={"":"あいうえお",k:"かきくけこ",s:"さしすせそ",t:"たちつてと",n:"なにぬねの",h:"はひふへほ",m:"まみむめも",y:"や い ゆ いぇよ",r:"らりるれろ",w:"わうぃううぇを",g:"がぎぐげご",z:"ざじずぜぞ",d:"だぢづでど",b:"ばびぶべぼ",p:"ぱぴぷぺぽ"};
  t.a="あ";t.i="い";t.u="う";t.e="え";t.o="お";
  "kstnhmrgzdbp".split("").forEach(c=>{ [...rows[c]].forEach((k,i)=>t[c+V[i]]=k); });
  t.ya="や";t.yu="ゆ";t.yo="よ";t.ye="いぇ";t.wa="わ";t.wo="を";t.wi="うぃ";t.we="うぇ";
  Object.assign(t,{shi:"し",chi:"ち",tsu:"つ",fu:"ふ",ji:"じ",si:"し",ti:"ち",tu:"つ",hu:"ふ",zi:"じ",di:"ぢ",du:"づ",
    sha:"しゃ",shu:"しゅ",sho:"しょ",she:"しぇ",cha:"ちゃ",chu:"ちゅ",cho:"ちょ",che:"ちぇ",ja:"じゃ",ju:"じゅ",jo:"じょ",je:"じぇ",
    jya:"じゃ",jyu:"じゅ",jyo:"じょ",cya:"ちゃ",cyu:"ちゅ",cyo:"ちょ",tya:"ちゃ",tyu:"ちゅ",tyo:"ちょ",sya:"しゃ",syu:"しゅ",syo:"しょ",zya:"じゃ",zyu:"じゅ",zyo:"じょ",
    fa:"ふぁ",fi:"ふぃ",fe:"ふぇ",fo:"ふぉ",va:"ゔぁ",vi:"ゔぃ",vu:"ゔ",ve:"ゔぇ",vo:"ゔぉ",thi:"てぃ",dhi:"でぃ",twu:"とぅ",dwu:"どぅ",
    xa:"ぁ",xi:"ぃ",xu:"ぅ",xe:"ぇ",xo:"ぉ",la:"ぁ",li:"ぃ",lu:"ぅ",le:"ぇ",lo:"ぉ",xya:"ゃ",xyu:"ゅ",xyo:"ょ",lya:"ゃ",lyu:"ゅ",lyo:"ょ",xtu:"っ",ltu:"っ",xtsu:"っ",ltsu:"っ",
    nn:"ん","n'":"ん","-":"ー"});
  const Y={k:"き",g:"ぎ",n:"に",h:"ひ",b:"び",p:"ぴ",m:"み",r:"り",d:"ぢ"};
  Object.keys(Y).forEach(c=>{ t[c+"ya"]=Y[c]+"ゃ"; t[c+"yu"]=Y[c]+"ゅ"; t[c+"yo"]=Y[c]+"ょ"; t[c+"ye"]=Y[c]+"ぇ"; });
  return t; })();
function romaToKana(s){
  s=s.toLowerCase(); let o="", i=0;
  while(i<s.length){
    const c=s[i], d=s[i+1];
    if(c===d && /[bcdfghjkmprstvwxyz]/.test(c)){ o+="っ"; i++; continue; }          // 促音
    if(c==="n" && (d===undefined || !/[aiueoyn']/.test(d))){ o+="ん"; i++; continue; } // ん
    if(c==="n" && d==="n"){ o+="ん"; i+= /[aiueoy]/.test(s[i+2]||"") ? 1 : 2; continue; }   // konnichiha → こんにちは
    let hit=false;
    for(let L=4;L>=1;L--){ const p=s.substr(i,L); if(RO[p]){ o+=RO[p]; i+=L; hit=true; break; } }
    if(!hit){ o+=c; i++; }
  }
  return o;
}
const toHira = s => s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const VOWEL = (()=>{ const m={}; const set=(str,v)=>[...str].forEach(c=>m[c]=v);
  set("あかさたなはまやらわがざだばぱぁゃゎ","あ"); set("いきしちにひみりぎじぢびぴぃ","い"); set("うくすつぬふむゆるぐずづぶぷぅゅゔ","う");
  set("えけせてねへめれげぜでべぺぇ","え"); set("おこそとのほもよろをごぞどぼぽぉょ","お"); return m; })();
function normKana(s){
  s=toHira(String(s||"").replace(/[\s・･　]/g,""));
  let o=""; for(const c of s){ if(c==="ー"||c==="-"){ const p=o[o.length-1]; o+= (p&&VOWEL[p])||""; } else o+=c; }
  return o;
}
function inputToKana(v){ v=String(v||"").trim(); return /[a-zA-Z]/.test(v) ? romaToKana(v) : v; }
const loose = s => s.replace(/おう/g,"おお").replace(/えい/g,"ええ");   // 長音寫法小錯（おう/おお）

/* ================= 儲存（雲端 + 本機） ================= */
const LS = "jvocab_n4_v1";
let S = { prog:{}, stars:{}, custom:[], settings:{}, log:{}, streak:{last:-1,n:0}, pending:[] };
function lsLoad(){ try{ const v=localStorage.getItem(LS); if(v) Object.assign(S, JSON.parse(v)); }catch(e){} }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function addCustomToIndex(){ S.custom.forEach(c=>{ c.custom=true; c.topic="我的單字"; if(!BY.has(K(c))) BY.set(K(c), c); }); }
lsLoad(); addCustomToIndex();

let cloud = null, saveTimer = null, saving = false, dirty = false;
function setSync(t){ document.getElementById("sync").textContent=t; }
function save(){
  lsSave(); dirty = true;
  if(!cloud) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500);
}
async function flush(){
  if(!cloud || saving || !dirty) return;
  saving = true; dirty = false; setSync("同步中…");
  try{ await cloud.set(JSON.parse(JSON.stringify({v:1, updated:Date.now(), ...S}))); setSync("☁️ 已同步"); }
  catch(e){ if(e && e.code==="invalid_argument"){ cloud=null; setSync("本機模式"); } else { dirty=true; setSync("同步失敗，稍後重試"); setTimeout(flush, 8000); } }
  saving = false;
  if(dirty) flush();
}
function fromData(d){ return { prog:d.prog||{}, stars:d.stars||{}, custom:d.custom||[], settings:d.settings||{}, log:d.log||{}, streak:d.streak||{last:-1,n:0}, pending:d.pending||[] }; }
(async ()=>{
  try{
    if(!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    const ref = db.doc("data/users/"+id+"/jvocab");
    setSync("連線中…");
    const snap = await ref.get();
    if(snap.exists){
      const d = JSON.parse(JSON.stringify(snap.data()||{}));  // 雲端資料是唯讀的，要先複製一份才能修改
      const localN = Object.keys(S.prog).length, cloudN = Object.keys(d.prog||{}).length;
      if(cloudN >= localN || (d.updated||0) > 0 && localN===0){ S = fromData(d); addCustomToIndex(); lsSave(); }
    }
    cloud = ref; setSync("☁️ 已同步");
    if(!snap.exists || Object.keys(S.prog).length > Object.keys((snap.data()||{}).prog||{}).length){ dirty=true; flush(); }
    if(state.tab==="home" && !state.quiz && !state.learn) render();
  }catch(e){ setSync("本機模式"); }
})();

/* ================= 學習狀態 ================= */
function P(x){ return S.prog[K(x)]; }          // [box, due, wrong, 學習日]
function learnedCount(){ return Object.keys(S.prog).length; }
function masteredCount(){ return Object.values(S.prog).filter(p=>p[0]>=MASTER_BOX).length; }
function dueList(){ const t=today(); return Object.keys(S.prog).filter(k=>S.prog[k][1]<=t).map(k=>BY.get(k)).filter(Boolean); }
function bumpLog(field,n=1){ const t=today(); S.log[t]=S.log[t]||{n:0,q:0,c:0}; S.log[t][field]+=n;
  if(S.streak.last!==t){ S.streak.n = (S.streak.last===t-1)? S.streak.n+1 : 1; S.streak.last=t; }
  const keys=Object.keys(S.log).map(Number).sort((a,b)=>a-b); while(keys.length>120) delete S.log[keys.shift()]; }
function learnedDay(k){ const p=S.prog[k]; if(!p) return null; return p[3]!=null ? p[3] : -1; }   // 只有用字卡學的字才有學習日
function recentLearned(days){ const t=today(); return Object.keys(S.prog).filter(k=>learnedDay(k)>t-days).map(k=>BY.get(k)).filter(Boolean); }
function todayLog(){ return S.log[today()]||{n:0,q:0,c:0}; }
function markLearned(x, known){
  const k=K(x); if(S.prog[k]) return;
  const box = known?2:1; S.prog[k]=[box, today()+INTERVALS[box], 0, today()]; bumpLog("n"); save();
}
function grade(x, ok){
  const k=K(x);
  if(!S.prog[k] && !x.custom){ bumpLog("q"); if(ok) bumpLog("c",1); save(); return; }   // 還沒學過的字：只算練習，不加入學習紀錄
  const p=S.prog[k] || [0,today(),0,-1];   // 自訂單字第一次測驗時才建立紀錄，不算「今天學的字」
  if(ok){ p[0]=Math.min(p[0]+1, INTERVALS.length-1); p[1]=today()+INTERVALS[p[0]]; }
  else { p[0]=1; p[1]=today(); p[2]=(p[2]||0)+1; }
  S.prog[k]=p; bumpLog("q"); if(ok) bumpLog("c",1); save();
}
/* ---- 三條路線：互不重複、各自固定洗牌（密碼才能還原） ---- */
function hashStr(t){ let h=2166136261; for(const c of t){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function seededShuffle(arr, seed){ const a=[...arr]; let x=seed||1; const rnd=()=>{ x|=0; x=x+0x6D2B79F5|0; let t=Math.imul(x^x>>>15,1|x); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const RL = (()=>{ const used=new Set(); return GROUPS.map(g=>{ const own=GW[g.id].filter(x=>{ const k=K(x); if(used.has(k)) return false; used.add(k); return true; });
  return seededShuffle(own, hashStr("jroute-"+g.id)); }); })();
function preset(){ return PRESETS[0]; }
const SORTED_RL = RL.map(l=>[...l].sort((a,b)=>normKana(a.r).localeCompare(normKana(b.r),"ja")));   // 單字庫依五十音排列
/* 依比例分配 n 個名額；某條路線字不夠時，由其他路線補上 */
function allocate(n, ratio, avail){
  const tot=ratio.reduce((a,b)=>a+b,0), exact=ratio.map(r=>r*n/tot), take=exact.map(Math.floor);
  let left=n-take.reduce((a,b)=>a+b,0);
  exact.map((e,i)=>[e-take[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(left>0){ take[i]++; left--; } });
  let short=0; take.forEach((t,i)=>{ if(t>avail[i]){ short+=t-avail[i]; take[i]=avail[i]; } });
  const order=ratio.map((r,i)=>[r,i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  while(short>0){ let moved=false; for(const i of order){ if(short>0 && take[i]<avail[i]){ take[i]++; short--; moved=true; } } if(!moved) break; }
  return take;
}
function pendingWords(){ return (S.pending||[]).map(k=>BY.get(k)).filter(x=>x && !S.prog[K(x)]); }
function nextNew(n){
  // 上次沒學完的字優先，剩下的名額再依 2:2:2 從三條路線抽
  const pend=pendingWords().slice(0,n), used=new Set(pend.map(K));
  const fresh=RL.map(list=>list.filter(x=>{ const k=K(x); return !S.prog[k] && !used.has(k); }));
  const take=allocate(n-pend.length, preset().r, fresh.map(f=>f.length));
  return [...pend, ...shuffle(fresh.flatMap((f,i)=>f.slice(0,take[i])))];
}
function routeLearned(i){ return RL[i].filter(x=>S.prog[K(x)]).length; }
/* ---- 4 位數進度密碼 ----
   密碼記錄：已完成幾組 6 個字，打散對應到 0000–9999，
   打錯時絕大多數會被判定為無效。回復時依同樣的比例重新排出每天的字。 */
const PW_MUL=7919, PW_ADD=4321, PW_MAX=640;
let PW_INV=1; for(let i=1;i<10000;i++){ if((PW_MUL*i)%10000===1){ PW_INV=i; break; } }
function currentPassword(){
  const total=RL.reduce((a,_,i)=>a+routeLearned(i),0), k=Math.min(PW_MAX-1, Math.floor(total/DAY));
  return { code:String((k*PW_MUL+PW_ADD)%10000).padStart(4,"0"), count:k*DAY, preset:0 };
}
function decodePassword(code){
  if(!/^\d{4}$/.test(code)) return null;
  const state=(((+code-PW_ADD)%10000+10000)%10000*PW_INV)%10000;
  if(state>=PRESETS.length*PW_MAX) return null;
  const pi=Math.floor(state/PW_MAX), k=state%PW_MAX;
  if(k*DAY>RL.reduce((a,l)=>a+l.length,0)) return null;
  return { preset:pi, count:k*DAY };
}
function applyPassword(d){
  const avail=RL.map(l=>l.length), got=[0,0,0];
  for(let b=0;b<d.count/DAY;b++){ const t=allocate(DAY, PRESETS[d.preset].r, avail.map((a,i)=>a-got[i])); t.forEach((v,i)=>got[i]+=v); }
  let added=0;
  RL.forEach((list,i)=>list.slice(0,got[i]).forEach((x,j)=>{ const k=K(x); if(!S.prog[k]){ S.prog[k]=[3, today()+(j%7), 0, today()-1]; added++; } }));
  save(); flush(); return added;
}
function bindPw(after){
  const b=document.getElementById("pwRestore"); if(!b) return;
  b.onclick=()=>{ const box=document.getElementById("pwBox");
    box.innerHTML=`<div style="margin-top:10px"><input id="pwIn" inputmode="numeric" maxlength="4" placeholder="0000" class="answer" style="letter-spacing:8px"><div id="pwMsg"></div>
      <div class="btns"><button class="btn" id="pwGo">確認</button></div></div>`;
    const inp=document.getElementById("pwIn"); inp.focus();
    document.getElementById("pwGo").onclick=()=>{
      const d=decodePassword(inp.value.trim()), msg=document.getElementById("pwMsg");
      if(!d){ msg.innerHTML='<div class="fb no">密碼不正確，請再確認一次。</div>'; return; }
      msg.innerHTML=`<div class="fb ok">這組密碼是：<b>已學 ${d.count} 個字</b><br>回復後會補上這些字的學習紀錄，你目前已有的進度不會被刪除。</div>
        <div class="btns"><button class="btn" id="pwYes">回復這個進度</button></div>`;
      document.getElementById("pwYes").onclick=()=>{ const n=applyPassword(d); toast(`已回復進度，補上 ${n} 個字`); after(); };
    };
  };
}

/* ================= 發音（日文） ================= */
let voice=null;
/* 語速：正常鍵用選定的速度，🐢 再放慢到 65% */
const SPEEDS=[0.65,0.8,0.9], SPEED_NAMES=["慢","標準","快"];
let speedLv = (()=>{ try{ const v=+localStorage.getItem("jvocab_speed"); return v>=0&&v<=2&&localStorage.getItem("jvocab_speed")!==null?v:1; }catch(e){ return 1; } })();
const APP_VERSION="v6（11/17 例句發音：慢速＋測驗答完可聽）";
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
let voiceMode = (()=>{ try{ return localStorage.getItem("jvocab_voice_mode")||"auto"; }catch(e){ return "auto"; } })();   // auto | plain | pick
function pickVoice(){ if(!("speechSynthesis" in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^ja[-_]/i.test(v.lang));
  voice = vs.find(v=>/Kyoko|Otoya|Google|Natural|Nanami|Haruka|Ayumi/i.test(v.name)) || vs[0] || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
/* Claude 語音（電腦版 App / Chrome 內可用）作為備援 */
let tts=null, ttsBlocked=false, browserWorks=null;
(async()=>{ try{ if(window.claude && claude.use){ tts = await claude.use("tts"); } }catch(e){ tts=null; } })();
function hasBrowserVoice(){ try{ return ("speechSynthesis" in window) && speechSynthesis.getVoices().some(v=>/^ja[-_]/i.test(v.lang)); }catch(e){ return false; } }
function speakTTS(text, slow, quiet){
  if(!tts || ttsBlocked){ if(!quiet) toast("這個裝置沒有可用的日文發音"); return; }
  tts.speak(text, {language:"ja", rate: slow?0.7:Math.max(0.7, Math.min(1, SPEEDS[speedLv]+0.15))}).catch(e=>{
    const c=e&&e.code;
    if(c==="not_granted"||c==="unavailable"){ ttsBlocked=true; if(!quiet) toast("朗讀功能已關閉，可在頁面的權限選單重新開啟"); }
    else if(c==="rate_limited"){ if(!quiet) toast("發音次數太頻繁，請稍等一下再按"); }
    else if(c==="no_gesture"){ if(quiet==="retry") toast("已切換成 Claude 語音，請再按一次 🔊"); }
    else if(c==="stopped"){ /* 被下一個發音取代 */ }
    else if(!quiet) toast("發音暫時失敗，請再按一次");
  });
}
/* ---- 靜音模式也發音（iPhone）---- */
let silentModeOn = (()=>{ try{ return localStorage.getItem("jvocab_silent_play")!=="off"; }catch(e){ return true; } })();
let audioUnlocked=false, silentAudio=null;
function silentWavURL(){
  const rate=8000, n=rate/2, buf=new ArrayBuffer(44+n), v=new DataView(buf);
  const w=(o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate,true); v.setUint16(32,1,true); v.setUint16(34,8,true); w(36,"data"); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
function unlockAudio(){
  if(!silentModeOn || audioUnlocked) return;
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  try{
    if(!silentAudio){ silentAudio=new Audio(silentWavURL()); silentAudio.loop=true; silentAudio.setAttribute("playsinline",""); silentAudio.volume=0.01; }
    const pr=silentAudio.play(); audioUnlocked=true;
    if(pr && pr.catch) pr.catch(()=>{ audioUnlocked=false; });
  }catch(e){ audioUnlocked=false; }
}
function stopSilent(){ try{ if(silentAudio){ silentAudio.pause(); } }catch(e){} audioUnlocked=false; try{ if(navigator.audioSession) navigator.audioSession.type="auto"; }catch(e){} }
if(IS_IOS){
  ["touchend","click"].forEach(ev=>document.addEventListener(ev, unlockAudio, true));
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ try{ silentAudio&&silentAudio.pause(); }catch(e){} audioUnlocked=false; } });
}
function browserSpeak(text, slow){
  if(IS_IOS) unlockAudio();
  const ss=window.speechSynthesis;
  if(ss.speaking||ss.pending) ss.cancel();
  if(!voice) pickVoice();
  const u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=slow?SPEEDS[speedLv]*0.65:SPEEDS[speedLv]; u.volume=1;
  // iPhone 指定聲音時，若該聲音沒下載會完全沒聲音，所以 iPhone 預設只指定語言、讓系統自己選聲音
  const useVoice = voiceMode==="pick" || (voiceMode==="auto" && !IS_IOS);
  if(useVoice && voice) try{ u.voice=voice; }catch(e){}
  ss.speak(u); try{ ss.resume(); }catch(e){}
  return u;
}
/* 日文發音的選擇：
   ① 裝置有日文聲音（iPhone Kyoko、Mac Kyoko、Windows Haruka/Nanami…）→ 一律用裝置的，日文最標準
   ② 聲音清單還沒載入 → 先試裝置的，1.5 秒沒出聲才改用 Claude 語音
   ③ 裝置確定沒有日文聲音 → 不讓英文聲音硬念日文；有 Claude 語音就用它，並提醒去安裝日文聲音 */
let lastEngine="—", warnedNoJa=false;
function jaVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^ja[-_]/i.test(v.lang)); }catch(e){ return []; } }
function warnNoJa(){ if(warnedNoJa) return; warnedNoJa=true;
  toast("這台裝置沒有日文聲音，發音可能帶外國腔。到「新增與設定 → 🔧 發音測試」看怎麼安裝日文聲音。", 6000); }
function speak(text, slow, auto){
  const hasSS = "speechSynthesis" in window;
  let all=[]; try{ all=hasSS?speechSynthesis.getVoices():[]; }catch(e){}
  const hasJa = jaVoices().length>0;
  if(hasSS && hasJa){ lastEngine="裝置日文聲音"; try{ browserSpeak(text, slow); }catch(e){ if(!auto) toast("無法播放發音"); } return; }
  if(!tts || ttsBlocked){
    if(!hasSS){ if(!auto) toast("這個瀏覽器不支援發音"); return; }
    if(all.length) warnNoJa();
    lastEngine = all.length ? "裝置聲音（沒有日文聲音）" : "裝置聲音";
    try{ browserSpeak(text, slow); }catch(e){ if(!auto) toast("無法播放發音"); }
    return;
  }
  if(hasSS && !all.length && browserWorks!==false){   // 聲音清單還沒載入
    try{
      const u=browserSpeak(text, slow); lastEngine="裝置聲音";
      let started=false; u.onstart=()=>{ started=true; browserWorks=true; };
      u.onerror=()=>{ if(!started){ browserWorks=false; lastEngine="Claude 語音"; speakTTS(text, slow, auto); } };
      if(browserWorks===null) setTimeout(()=>{ if(!started && !jaVoices().length){ browserWorks=false; try{speechSynthesis.cancel();}catch(e){} lastEngine="Claude 語音"; speakTTS(text, slow, auto?true:"retry"); } }, 1500);
      return;
    }catch(e){ browserWorks=false; }
  }
  warnNoJa(); lastEngine="Claude 語音（日文可能有外國腔）";
  speakTTS(text, slow, auto);
}

function findSpan(x){
  if(x.sp) return x.sp;
  if(!x.ex) return null;
  const w=x.w, c=[w];
  if(w.endsWith("する") && w.length>2) c.push(w.slice(0,-2)+"し", w.slice(0,-2));
  if(w==="する") c.push("し");
  if(w.length>1) c.push(w.slice(0,-1));

function blankSentence(x){
  if(!x.ex) return null;
  const sp=findSpan(x);

  const form=x.ex.slice(sp[0],sp[1]);
  return { html: esc(x.ex.slice(0,sp[0]))+`<span class="blank">${"＿".repeat(Math.max(2,Math.min(6,[...form].length)))}</span>`+esc(x.ex.slice(sp[1])),
           changed: form!==x.w, form };
}
function renderQuestion(){
  const q=state.quiz, x=q.items[q.i]; q.hints=0; q.answered=false; q.showKanji=false;
  const chars=[...x.r];
  q.hintOrder=shuffle(chars.map((c,i)=>i));   // 提示隨機揭露假名位置
  const b=blankSentence(x), hasKanji = x.w!==x.r;
  app.innerHTML=`<div class="q-meta"><span>${q.retry?"🔁 錯題再練":esc(q.label)+"・第 "+(q.i+1)+" / "+q.items.length+" 題"}</span><span>答對 ${q.score}</span></div>
  <div class="bar" style="margin-bottom:10px"><i style="width:${q.i/q.items.length*100}%"></i></div>
  <div class="card">
    <div class="q-zh">${esc(x.zh)} <span class="pos">${esc(x.pos)}</span></div>
    ${b?`<div class="q-sent ja">${b.html}</div>${x.exZh?`<div class="zh2">${esc(x.exZh)}</div>`:""}${b.changed?`<div class="muted" style="margin-top:4px">💬 空格裡是這個字的變化形（例如ます形、て形），請輸入<b>原形（辭書形）</b>的讀音。</div>`:""}`:""}
    <div class="btns" style="flex-wrap:wrap"><button class="icon" id="say">🔊 聽單字</button><button class="icon" id="slow">🐢 慢速</button>${hasKanji?`<button class="icon" id="kj">🈶 看漢字</button>`:""}<button class="icon" id="hint">💡 提示</button></div>
    <div id="kjBox" class="ja" style="margin-top:8px;font-size:22px;font-weight:700"></div>

    <div class="preview ja" id="pv"></div>
    <div id="fb"></div>
    <div class="btns"><button class="btn ghost" id="skip">不會，看答案</button><button class="btn" id="check">送出</button></div>
  </div>
  <div class="center"><button class="icon" id="quit" style="margin-top:4px">結束測驗</button>
  <p class="muted">可以用日文鍵盤打假名，也可以直接打羅馬拼音（例如 taberu → たべる）。</p></div>`;
  const ans=document.getElementById("ans"), pv=document.getElementById("pv");
  ans.addEventListener("input",()=>{ const v=ans.value; pv.textContent = /[a-zA-Z]/.test(v) ? "→ "+inputToKana(v) : ""; });
  document.getElementById("say").onclick=()=>speak(x.r);
  document.getElementById("slow").onclick=()=>speak(x.r,true);
  const kj=document.getElementById("kj"); if(kj) kj.onclick=()=>{ q.showKanji=true; document.getElementById("kjBox").textContent="漢字："+x.w; kj.disabled=true; };
  document.getElementById("hint").onclick=()=>{ q.hints=Math.min(q.hints+1,q.hintOrder.length);
    const open=new Set(q.hintOrder.slice(0,q.hints));

    document.getElementById("hintBox").textContent=`提示：${shown}（${chars.length} 個假名）`; };
  document.getElementById("check").onclick=()=>check(false);
  document.getElementById("skip").onclick=()=>check(true);
  document.getElementById("quit").onclick=()=>finish();
  ans.addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); q.answered?next():check(false); } });
  ans.focus(); speak(x.r,false,true);
}
function diffHTML(input,target){ let o=""; const a=[...input], t=[...target]; for(let i=0;i<t.length;i++){ const c=t[i]; o+=(a[i]&&normKana(a[i])===normKana(c))?esc(c):`<b>${esc(c)}</b>`; } return o; }
function check(giveUp){
  const q=state.quiz, x=q.items[q.i]; if(q.answered) return next();
  const v=document.getElementById("ans").value;
  if(!giveUp && !v.trim()){ toast("請先輸入答案"); return; }
  q.answered=true;
  const kana=inputToKana(v), a=normKana(kana), t=normKana(x.r);
  const exact = !giveUp && (a===t || v.trim()===x.w);
  const near = !giveUp && !exact && loose(a)===loose(t);
  const ok = exact || near;
  const fb=document.getElementById("fb");
  if(!q.retry) grade(x, ok && q.hints<2);
  const word = x.w!==x.r ? `<b>${esc(x.w)}</b>（${esc(x.r)}）` : `<b>${esc(x.r)}</b>`;
  if(ok){ if(!q.retry) q.score++; fb.innerHTML=`<div class="fb ok">✅ 正確！${word}${q.hints?`（用了 ${q.hints} 個提示）`:""}${near?`<div class="muted">注意長音：正確寫法是 ${esc(x.r)}</div>`:""}</div>`; }
  else{ if(!q.wrong.includes(x)) q.wrong.push(x);
    fb.innerHTML=`<div class="fb no">${giveUp?"答案是：":"❌ 正確讀音："}<div class="diff ja">${diffHTML(kana,x.r)}</div>${x.w!==x.r?`<div class="ja">${esc(x.w)}</div>`:""}${v.trim()&&!giveUp?`<div class="muted">你寫的：${esc(kana)}</div>`:""}</div>`; }
  if(x.ex){   // 答完才顯示完整例句和例句發音（答題前播會洩漏答案）
    const sp=findSpan(x), full = sp ? esc(x.ex.slice(0,sp[0]))+`<b style="color:var(--accent)">${esc(x.ex.slice(sp[0],sp[1]))}</b>`+esc(x.ex.slice(sp[1])) : esc(x.ex);
    fb.insertAdjacentHTML("beforeend", `<div class="ex"><div class="row"><div class="grow ja">${full}</div><button class="icon" data-say="${esc(x.ex)}">🔊 例句</button><button class="icon" data-slow="${esc(x.ex)}">🐢</button></div></div>`);
    bindSpeak(fb);
  }
  speak(x.r);
  const btn=document.getElementById("check"); btn.textContent="下一題 →"; btn.onclick=next;
  document.getElementById("skip").style.display="none";
}
function next(){
  const q=state.quiz; q.i++;
  if(q.i<q.items.length) return renderQuestion();
  if(!q.retry && q.wrong.length){
    q.missed=[...q.wrong]; q.retry=true; q.items=shuffle([...q.wrong]); q.i=0; q.wrong=[];
    app.innerHTML=`<div class="card center"><h2>第一輪：${q.score} / ${q.first}</h2><p class="muted">把答錯的 ${q.items.length} 個字再練一次。</p><button class="btn" id="go">開始</button></div>`;
    document.getElementById("go").onclick=renderQuestion; return;
  }
  finish();
}
function finish(){
  const q=state.quiz; q.done=true; flush();
  const missed=q.missed||q.wrong||[]; const answered=q.retry?q.first:q.i;
  const pct=answered?Math.round(q.score/answered*100):0;
  app.innerHTML=`<div class="card center"><div class="muted">${esc(q.label)}・完成</div><div class="big">${q.score} / ${answered}</div>
    <div>${pct>=90?"太厲害了！🎉":pct>=70?"很不錯，繼續保持！💪":"多練幾次就會越來越熟 🌱"}</div></div>
  ${missed.length?`<div class="card"><h2>這次答錯的字</h2>${missed.map(x=>`<div class="row" style="margin-top:8px"><div class="grow ja"><b>${esc(x.w)}</b> <span style="color:var(--accent)">${x.w!==x.r?esc(x.r):""}</span> <span class="muted">${esc(x.zh)}</span></div>${spk(x)}</div>`).join("")}
    <p class="muted">這些字已經排進今天的複習清單。</p></div>`:""}
  ${state.resumeLearn&&state.resumeLearn.items.length?`<div class="btns"><button class="btn" id="resume">🃏 繼續學剩下的 ${state.resumeLearn.items.length} 個新字</button></div>`:""}
  <div class="btns"><button class="btn ghost" id="home">回首頁</button><button class="btn ghost" id="again">${q.label==="總複習"?"再來 10 題":"再測一次"}</button></div>`;
  bindSpeak();
  const rs=document.getElementById("resume"); if(rs) rs.onclick=()=>{ state.quiz=null; state.learn=state.resumeLearn; state.resumeLearn=null; go("learn"); };
  document.getElementById("home").onclick=()=>{ state.quiz=null; go("home"); };
  document.getElementById("again").onclick=()=>{ const lb=q.label, it= lb==="總複習"? totalReviewItems() : lb==="今天的字"? shuffle(recentLearned(1)) : shuffle([...q.orig]); state.quiz=null; startQuiz(it, lb); };
}

const KQ_N = 10;
let kqScope = (()=>{ try{ return localStorage.getItem("jvocab_kq_scope")||"basic"; }catch(e){ return "basic"; } })();
const CONFUSE = { "シ":"ツソン","ツ":"シソン","ソ":"ンシツ","ン":"ソシツ","ヌ":"スメ","ス":"ヌ","ク":"ケタワ","ケ":"クタ","タ":"クケ","コ":"ユ","ユ":"コ","ウ":"ワフ","ワ":"ウフク","フ":"ウワ","チ":"テ","テ":"チ","ノ":"メ","メ":"ノヌ","ア":"マ","マ":"ア","ロ":"コ",
  "ぬ":"めね","め":"ぬ","ね":"れわぬ","れ":"ねわ","わ":"ねれ","る":"ろ","ろ":"る","さ":"ちき","ち":"さら","き":"さ","は":"ほ","ほ":"は","い":"り","り":"い","あ":"お","お":"あ","こ":"い","う":"ら","ら":"う" };
function kqPool(){
  const rows=[...KANA_SETS.basic, ...(kqScope!=="basic"?KANA_SETS.daku:[]), ...(kqScope==="yoon"?KANA_SETS.yoon:[])];
  const cells=rows.flat().filter(([k])=>k && !/[ぢづ]/.test(k));
  return cells.flatMap(([k,ro])=>[{k, t:"hira", ro},{k:toKata(k), t:"kata", ro}]);
}
function kqOptions(item, pool){
  const ro=new Map(pool.map(p=>[p.k,p.ro])), opts=new Set([item.ro]);
  [...(CONFUSE[item.k]||"")].forEach(c=>{ if(opts.size<4 && ro.has(c)) opts.add(ro.get(c)); });
  for(const p of shuffle([...pool])){ if(opts.size>=4) break; opts.add(p.ro); }
  return shuffle([...opts]);
}
let KQ=null;
function openKanaQuiz(){
  const pool=kqPool();
  KQ={pool, items:shuffle([...pool]).slice(0,KQ_N), i:0, typeOk:0, readOk:0, wrong:[], stage:"type"};
  let ov=document.getElementById("kqOv");
  if(!ov){ ov=document.createElement("div"); ov.id="kqOv"; ov.className="overlay"; document.body.appendChild(ov); }
  ov.style.display="flex"; document.body.style.overflow="hidden"; drawKQ();
}
function closeKanaQuiz(){ const ov=document.getElementById("kqOv"); if(ov) ov.style.display="none"; document.body.style.overflow=""; KQ=null; }
function drawKQ(){
  const ov=document.getElementById("kqOv"), q=KQ;
  const head=`<div class="row"><b class="grow">🎯 五十音小測驗</b><button class="icon" id="kqX">✕ 關閉</button></div>`;
  if(q.i>=q.items.length){
    const both=q.items.length-q.wrong.length;
    ov.innerHTML=`<div class="sheet">${head}
      <div class="big" style="margin-top:10px">${both} / ${q.items.length}</div>
      <p class="center" style="margin:0">兩題都答對的字</p>
      <p class="muted center">平假名／片假名判斷對 ${q.typeOk} 題・讀音對 ${q.readOk} 題</p>
      ${q.wrong.length?`<h2>再看一次</h2><div class="seg">${q.wrong.map(x=>`<button class="ja" data-say="${toHiraK(x.k)}">${x.k}　${x.ro}（${x.t==="hira"?"平":"片"}）</button>`).join("")}</div>`:`<p class="center">全部答對，太厲害了！🎉</p>`}
      <div class="btns"><button class="btn ghost" id="kqClose">關閉</button><button class="btn" id="kqAgain">再來 ${KQ_N} 題</button></div></div>`;
    bindSpeak(ov);
    document.getElementById("kqX").onclick=closeKanaQuiz; document.getElementById("kqClose").onclick=closeKanaQuiz;
    document.getElementById("kqAgain").onclick=openKanaQuiz; return;
  }
  const x=q.items[q.i];
  ov.innerHTML=`<div class="sheet">${head}
    <div class="seg" id="kqScope" style="margin-top:8px"><button data-s="basic">清音</button><button data-s="daku">＋濁音</button><button data-s="yoon">＋拗音</button></div>
    <div class="q-meta" style="margin-top:10px"><span>第 ${q.i+1} / ${q.items.length} 題</span><span>種類 ${q.typeOk}・讀音 ${q.readOk}</span></div>
    <div class="bar"><i style="width:${q.i/q.items.length*100}%"></i></div>
    <div class="kbig ja">${x.k}</div>
    <div id="kqBody"></div></div>`;
  document.getElementById("kqX").onclick=closeKanaQuiz;
  document.querySelectorAll("#kqScope button").forEach(b=>{ b.classList.toggle("on",b.dataset.s===kqScope);
    b.onclick=()=>{ kqScope=b.dataset.s; try{ localStorage.setItem("jvocab_kq_scope",kqScope); }catch(e){} openKanaQuiz(); }; });
  const body=document.getElementById("kqBody");
  let typeRight=false;
  body.innerHTML=`<p class="center" style="margin:4px 0 8px">① 這是平假名還是片假名？</p>
    <div class="btns" style="margin-top:0"><button class="btn ghost" data-t="hira">平假名</button><button class="btn ghost" data-t="kata">片假名</button></div><div id="kqStep2"></div>`;
  body.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(body.dataset.typed) return; body.dataset.typed=1;
    typeRight = b.dataset.t===x.t; if(typeRight) q.typeOk++;
    body.querySelectorAll("[data-t]").forEach(o=>{ o.disabled=true; if(o.dataset.t===x.t) o.style.cssText="background:var(--accent-soft);color:var(--accent);border-color:var(--accent);opacity:1"; else if(o===b) o.style.cssText="background:var(--warn-soft);color:var(--warn);opacity:1"; });
    const opts=kqOptions(x, q.pool), s2=document.getElementById("kqStep2");
    s2.innerHTML=`<div class="fb ${typeRight?"ok":"no"}">${typeRight?"✅ 對！":"❌ 不對，"}這是<b>${x.t==="hira"?"平假名":"片假名"}</b>${x.t==="hira"?`（片假名寫成 ${toKata(x.k)}）`:`（平假名寫成 ${toHiraK(x.k)}）`}</div>
      <p class="center" style="margin:10px 0 8px">② 它念什麼？</p>
      <div class="kopts">${opts.map(o=>`<button class="btn ghost" data-ro="${o}">${o}</button>`).join("")}</div><div id="kqFb"></div>`;
    s2.querySelectorAll("[data-ro]").forEach(ob=>ob.onclick=()=>{
      if(s2.dataset.done) return; s2.dataset.done=1;
      const ok=ob.dataset.ro===x.ro; if(ok) q.readOk++;
      if(!ok || !typeRight) q.wrong.push(x);
      s2.querySelectorAll("[data-ro]").forEach(o=>{ o.disabled=true; if(o.dataset.ro===x.ro) o.style.cssText="background:var(--accent-soft);color:var(--accent);border-color:var(--accent);opacity:1"; else if(o===ob) o.style.cssText="background:var(--warn-soft);color:var(--warn);opacity:1"; });
      speak(toHiraK(x.k));
      document.getElementById("kqFb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✅ 正確！":"❌ "}<b class="ja">${x.k}</b> 念 <b>${x.ro}</b> <button class="icon" data-say="${toHiraK(x.k)}">🔊 再聽一次</button></div>
        <div class="btns"><button class="btn" id="kqNext">${q.i+1<q.items.length?"下一題 →":"看結果"}</button></div>`;
      bindSpeak(ov);
      document.getElementById("kqNext").onclick=()=>{ q.i++; drawKQ(); };
    });
  });
}
const toHiraK = s => s.replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60));

/* ================= 新增與設定 ================= */
function renderAdd(){
  app.innerHTML=`<div class="card"><h2>新增你自己的單字</h2>
    <p class="muted" style="margin-top:0">課本、日劇或旅行中遇到的新字加進來，會放在「我的單字」，也會排進複習和測驗。</p>

    <label>中文意思 *</label><input id="zh" placeholder="例如：吃">

    <div class="btns"><button class="icon" id="try">🔊 試聽</button></div>
    <div class="btns"><button class="btn" id="save">加入單字本</button></div></div>
  <div class="card"><h2>一次貼上很多字</h2>
    <p class="muted" style="margin-top:0">每行一個：<code>日文 | 讀音 | 中文 | 例句 | 例句翻譯</code>（後兩項可省略）</p>

    <div class="btns"><button class="btn ghost" id="bulkSave">批次加入</button></div></div>
  <div class="card"><h2>進度保存</h2>
    <p class="muted" style="margin:0">${cloud?"☁️ 你的學習進度、收藏和自訂單字會存到你的 Claude 帳號，換手機或電腦登入同一個帳號打開就能接著學。":"目前存在這個瀏覽器裡。登入 Claude 打開這個頁面時，進度會自動同步到你的帳號。"}</p>
    <div class="btns"><button class="btn ghost" id="copy">複製我的單字（${S.custom.length} 個）</button></div></div>
  <div class="card"><h2>🔧 發音測試</h2>
    <div id="diag" class="muted" style="font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap"></div>
    <label>發音方式</label>
    <div class="seg" id="vmSeg"><button data-v="auto">自動</button><button data-v="plain">系統預設聲音</button><button data-v="pick">指定日文聲音</button></div>
    <label>語速（🔊 用這個速度，🐢 會再更慢）</label>
    <div class="seg" id="spSeg">${SPEED_NAMES.map((n,i)=>`<button data-sp="${i}">${n}</button>`).join("")}</div>
    <div class="btns"><button class="btn ghost ja" id="vTest">🔊 測試發音：こんにちは、はじめまして。</button></div>
    <div class="btns"><button class="btn ghost" id="smBtn"></button></div>
    <p class="muted" style="margin:6px 0 0">開啟後，iPhone 靜音時也會發音；但用單字本時，背景音樂（例如 Spotify）可能會被暫停。</p>
    <div class="note" id="noJa" style="margin-top:10px;display:none"><b>⚠️ 這台裝置沒有日文聲音</b>，所以日文會被念成外國腔。裝好日文聲音後，<b>完全關掉 Claude App 再打開</b>就會自動改用：<br>
      ・Windows：設定 → 時間與語言 → 語音 → 「新增語音」→ 選「日文（日本）」。<br>
      ・Mac：系統設定 → 輔助使用 → 朗讀內容 → 系統聲音 → 管理聲音 → 日文 → 下載 Kyoko。</div>
    <p class="muted" style="margin:8px 0 0">iPhone 沒聲音時請檢查：① 側邊靜音開關或「動作按鈕」不要開靜音 ② 音量調大 ③ 設定 → 輔助使用 → 朗讀內容 → 聲音 → 日文，下載一個日文聲音（例如 Kyoko）。</p>
    <p class="muted" style="margin:8px 0 0">想打假名的話：設定 → 一般 → 鍵盤 → 鍵盤 → 新增鍵盤 → 日文（假名或羅馬拼音）。不加也沒關係，直接打羅馬拼音就可以。</p></div>
  <div class="card"><h2>完整進度備份</h2>
    <p class="muted" style="margin-top:0">把學習進度、收藏、自訂單字整包複製成一段備份碼，貼到記事本或傳給自己保存。換手機、換瀏覽器或清除資料後，貼回來就能還原。</p>
    <div class="btns"><button class="btn ghost" id="bk">📋 複製進度備份碼</button></div>
    <textarea id="bkText" rows="3" placeholder="要還原時，把備份碼貼在這裡" style="margin-top:10px"></textarea>
    <div class="btns"><button class="btn ghost" id="rs">♻️ 用備份碼還原</button></div>
    <div id="rsConfirm"></div></div>`;
  const $=id=>document.getElementById(id);
  const TEST="こんにちは、はじめまして。";
  const showDiag=()=>{ let v=[]; try{ v=speechSynthesis.getVoices(); }catch(e){}
    const ja=v.filter(x=>/^ja[-_]/i.test(x.lang));
    $("diag").textContent=`版本：${APP_VERSION}\n裝置：${IS_IOS?"iPhone/iPad":"其他"}\n支援語音：${"speechSynthesis" in window?"是":"否"}\n聲音數量：${v.length}（日文 ${ja.length}）\n指定聲音：${voice?voice.name+" "+voice.lang:"無"}\nClaude 語音：${tts?"有":"無"}\n上次發音用：${lastEngine}\n靜音模式發音：${silentModeOn?"開":"關"}（${navigator.audioSession?"支援音訊類型設定":"不支援音訊類型設定"}，無聲音訊${audioUnlocked?"播放中":"未播放"}）`;
    $("noJa").style.display = (v.length && !ja.length) ? "block" : "none";
    $("smBtn").textContent = silentModeOn ? "🔔 靜音模式也發音：開（點一下關閉）" : "🔕 靜音模式也發音：關（點一下開啟）";
    document.querySelectorAll("#vmSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===voiceMode));
    document.querySelectorAll("#spSeg button").forEach(b=>b.classList.toggle("on",+b.dataset.sp===speedLv)); };
  showDiag(); try{ speechSynthesis.onvoiceschanged=()=>{ pickVoice(); showDiag(); }; }catch(e){}
  document.querySelectorAll("#vmSeg button").forEach(b=>b.onclick=()=>{ voiceMode=b.dataset.v; try{ localStorage.setItem("jvocab_voice_mode",voiceMode); }catch(e){} showDiag(); speak(TEST); });
  document.querySelectorAll("#spSeg button").forEach(b=>b.onclick=()=>{ speedLv=+b.dataset.sp; try{ localStorage.setItem("jvocab_speed",speedLv); }catch(e){} showDiag(); speak(TEST); });
  $("vTest").onclick=()=>{ speak(TEST); setTimeout(showDiag,300); };
  $("smBtn").onclick=()=>{ silentModeOn=!silentModeOn; try{ localStorage.setItem("jvocab_silent_play", silentModeOn?"on":"off"); }catch(e){} if(silentModeOn) unlockAudio(); else stopSilent(); showDiag(); };
  $("try").onclick=()=>{ const r=inputToKana($("r").value.trim())||$("w").value.trim(); if(r) speak(r); };
  const addOne=(item)=>{ item.r=toHira(inputToKana(item.r)); if(!item.r) item.r=item.w; if(BY.has(K(item))) return false; item.custom=true; item.topic="我的單字"; S.custom.push(item); BY.set(K(item), item); return true; };
  $("save").onclick=()=>{ const item={w:$("w").value.trim(),r:$("r").value.trim(),pos:$("pos").value.trim(),zh:$("zh").value.trim(),ex:$("ex").value.trim(),exZh:$("exZh").value.trim()};
    if(!item.w||!item.r||!item.zh){ toast("請至少填日文、讀音和中文意思"); return; }
    if(!addOne(item)){ toast(`「${item.w}」已經在單字本裡了`); return; }
    save(); toast(`已加入「${item.w}」`); render(); };
  $("bulkSave").onclick=()=>{ let n=0,dup=0; $("bulk").value.split("\n").forEach(line=>{ const p=line.split("|").map(s=>s.trim());
      if(p[0]&&p[1]&&p[2]){ addOne({w:p[0],r:p[1],pos:"",zh:p[2],ex:p[3]||"",exZh:p[4]||""})?n++:dup++; } });
    if(!n){ toast(dup?"這些字都已經在單字本裡了":"沒有讀到格式正確的行"); return; }
    save(); toast(`已加入 ${n} 個單字`+(dup?`（${dup} 個重複略過）`:"")); render(); };
  $("bk").onclick=async()=>{ const txt="JVOCAB1:"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    try{ await navigator.clipboard.writeText(txt); toast("備份碼已複製，請貼到記事本保存"); } catch(e){ $("bkText").value=txt; $("bkText").select(); toast("無法自動複製，備份碼已放在下方文字框，請手動複製"); } };
  $("rs").onclick=()=>{ const v=$("bkText").value.trim(); let d=null;
    try{ if(v.startsWith("JVOCAB1:")) d=JSON.parse(decodeURIComponent(escape(atob(v.slice(8))))); }catch(e){}
    if(!d||typeof d.prog!=="object"){ toast("備份碼格式不正確"); return; }
    $("rsConfirm").innerHTML=`<div class="fb ok">備份裡有 ${Object.keys(d.prog).length} 個已學的字。還原後會取代目前的進度。</div><div class="btns"><button class="btn warn" id="rsYes">確定還原</button></div>`;
    $("rsYes").onclick=()=>{ S=fromData(d); addCustomToIndex(); save(); flush(); toast("進度已還原"); go("home"); }; };
  $("copy").onclick=async()=>{ const txt=S.custom.map(x=>[x.w,x.r,x.zh,x.ex,x.exZh].join(" | ")).join("\n");
    try{ await navigator.clipboard.writeText(txt); toast("已複製"); } catch(e){ $("bulk").value=txt; toast("無法自動複製，已放到上方文字框"); } };
}

window.addEventListener("pagehide", ()=>{ lsSave(); });
/* 過了午夜自動換成新的一天 */
let shownDay=today();
function checkDay(){ if(today()!==shownDay){ shownDay=today(); if(state.learn){ /* 學字中不打斷 */ } else if(!state.quiz||state.quiz.done){ state.quiz=null; if(state.tab==="quiz") state.tab="home"; render(); toast("新的一天開始了！"); } } }
setInterval(checkDay, 30000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkDay(); });
window.addEventListener("focus", checkDay);
if(!ALL.length) app.innerHTML='<div class="empty">單字資料載入失敗，請重新整理頁面。</div>'; else render();
